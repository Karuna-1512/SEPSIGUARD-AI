<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">SepsiGuard AI model flow and training pipeline</title>
  <desc id="desc">A two-stage diagram showing the SepsiGuard dataset schema, patient-grouped GRU training and evaluation, saved model artifacts, and application-time risk prediction and reporting.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#17665e"/>
    </marker>
    <style>
      text { font-family: Inter, Aptos, Arial, sans-serif; fill: #243b3a; }
      .muted { fill: #5c6e70; }
      .section { font-size: 22px; font-weight: 700; letter-spacing: 1.1px; fill: #17665e; }
      .card-title { font-size: 19px; font-weight: 700; fill: #173f3b; }
      .body { font-size: 16px; fill: #405557; }
      .small { font-size: 14px; fill: #5c6e70; }
      .feature { font-size: 15px; font-weight: 600; fill: #35504f; }
      .flow-card { fill: #ffffff; stroke: #cfddda; stroke-width: 2; }
      .flow-arrow { fill: none; stroke: #17665e; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#f4f8f7"/>
  <rect x="0" y="0" width="1800" height="14" fill="#17665e"/>

  <!-- Title -->
  <text x="76" y="69" font-size="18" font-weight="700" letter-spacing="2.3" fill="#17665e">SEPSIGUARD AI</text>
  <text x="76" y="119" font-size="38" font-weight="750">Model Flow &amp; Training Pipeline</text>
  <text x="78" y="151" font-size="18" class="muted">Longitudinal clinical data → patient-level training → GRU risk assessment</text>
  <rect x="1373" y="55" width="350" height="48" rx="24" fill="#fff2dc" stroke="#e8ca8f"/>
  <circle cx="1401" cy="79" r="6" fill="#c58a36"/>
  <text x="1418" y="85" font-size="14" font-weight="700" letter-spacing="1" fill="#80591f">RESEARCH ONLY · NOT CLINICALLY VALIDATED</text>

  <!-- Dataset schema -->
  <rect x="70" y="178" width="1660" height="167" rx="18" fill="#ffffff" stroke="#cfddda" stroke-width="2"/>
  <text x="96" y="212" font-size="20" font-weight="700" fill="#17665e">INPUT DATASET · 12 time steps per patient · 12 named clinical features</text>
  <text x="1698" y="212" text-anchor="end" font-size="15" class="muted">Keys: patient_id · time_step · sepsis_label</text>

  <g>
    <rect x="96" y="230" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="218" y="254" text-anchor="middle">Heart rate · bpm</text>
    <rect x="365" y="230" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="487" y="254" text-anchor="middle">Respiratory rate · breaths/min</text>
    <rect x="634" y="230" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="756" y="254" text-anchor="middle">Temperature · °C</text>
    <rect x="903" y="230" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="1025" y="254" text-anchor="middle">Systolic BP · mmHg</text>
    <rect x="1172" y="230" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="1294" y="254" text-anchor="middle">Diastolic BP · mmHg</text>
    <rect x="1441" y="230" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="1563" y="254" text-anchor="middle">Oxygen saturation · %</text>

    <rect x="96" y="284" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="218" y="308" text-anchor="middle">WBC · ×10³/µL</text>
    <rect x="365" y="284" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="487" y="308" text-anchor="middle">Lactate · mmol/L</text>
    <rect x="634" y="284" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="756" y="308" text-anchor="middle">Creatinine · mg/dL</text>
    <rect x="903" y="284" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="1025" y="308" text-anchor="middle">Platelets · ×10³/µL</text>
    <rect x="1172" y="284" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="1294" y="308" text-anchor="middle">Bilirubin · mg/dL</text>
    <rect x="1441" y="284" width="245" height="38" rx="10" fill="#edf5f3"/><text class="feature" x="1563" y="308" text-anchor="middle">Age · years</text>
  </g>

  <!-- Training pipeline -->
  <text x="76" y="383" class="section">01 · TRAINING &amp; ARTIFACT CREATION</text>
  <path class="flow-arrow" d="M210 345 V374"/>
  <g class="flow-arrow">
    <path d="M330 526 H347"/><path d="M610 526 H627"/><path d="M890 526 H907"/>
    <path d="M1170 526 H1187"/><path d="M1450 526 H1467"/>
  </g>

  <g>
    <rect class="flow-card" x="70" y="401" width="260" height="274" rx="16"/>
    <circle cx="101" cy="437" r="19" fill="#17665e"/><text x="101" y="444" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text class="card-title" x="129" y="444">Validate CSV</text>
    <text class="body" x="92" y="485"><tspan x="92">Exact 15-column schema;</tspan><tspan x="92" dy="24">numeric, in-range values;</tspan><tspan x="92" dy="24">12 ordered steps per patient;</tspan><tspan x="92" dy="24">one consistent binary</tspan><tspan x="92" dy="24">sepsis_label per patient.</tspan></text>

    <rect class="flow-card" x="350" y="401" width="260" height="274" rx="16"/>
    <circle cx="381" cy="437" r="19" fill="#17665e"/><text x="381" y="444" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text class="card-title" x="409" y="444">Build sequences</text>
    <text class="body" x="372" y="485"><tspan x="372">Group rows by patient_id.</tspan><tspan x="372" dy="24">Sort each patient by</tspan><tspan x="372" dy="24">time_step (1–12).</tspan><tspan x="372" dy="24">Keep age and target label</tspan><tspan x="372" dy="24">consistent within sequence.</tspan></text>

    <rect class="flow-card" x="630" y="401" width="260" height="274" rx="16"/>
    <circle cx="661" cy="437" r="19" fill="#17665e"/><text x="661" y="444" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
    <text class="card-title" x="689" y="444">Split by patient</text>
    <text class="body" x="652" y="485"><tspan x="652">GroupShuffleSplit creates</tspan><tspan x="652" dy="24">train, validation and</tspan><tspan x="652" dy="24">held-out test groups.</tspan><tspan x="652" dy="24">A patient's time steps stay</tspan><tspan x="652" dy="24">together to avoid leakage.</tspan></text>

    <rect class="flow-card" x="910" y="401" width="260" height="274" rx="16"/>
    <circle cx="941" cy="437" r="19" fill="#17665e"/><text x="941" y="444" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
    <text class="card-title" x="969" y="444">Preprocess</text>
    <text class="body" x="932" y="485"><tspan x="932">Median imputation +</tspan><tspan x="932" dy="24">StandardScaler.</tspan><tspan x="932" dy="24">Fit using training patients</tspan><tspan x="932" dy="24">only; transform all splits.</tspan><tspan x="932" dy="24">Tensor shape: N × 12 × 12.</tspan></text>

    <rect class="flow-card" x="1190" y="401" width="260" height="274" rx="16"/>
    <circle cx="1221" cy="437" r="19" fill="#17665e"/><text x="1221" y="444" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">5</text>
    <text class="card-title" x="1249" y="444">GRU architecture</text>
    <text class="body" x="1212" y="485"><tspan x="1212">Input (12, 12)</tspan><tspan x="1212" dy="23">GRU 64 · return sequences</tspan><tspan x="1212" dy="23">Dropout 0.25 → GRU 32</tspan><tspan x="1212" dy="23">Dropout 0.25 → Dense 32</tspan><tspan x="1212" dy="23">ReLU → Dense 1 · sigmoid</tspan></text>

    <rect class="flow-card" x="1470" y="401" width="260" height="274" rx="16"/>
    <circle cx="1501" cy="437" r="19" fill="#17665e"/><text x="1501" y="444" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">6</text>
    <text class="card-title" x="1529" y="444">Train &amp; evaluate</text>
    <text class="body" x="1492" y="485"><tspan x="1492">Binary cross-entropy</tspan><tspan x="1492" dy="24">with Adam optimizer.</tspan><tspan x="1492" dy="24">Early stopping on</tspan><tspan x="1492" dy="24">validation loss; evaluate on</tspan><tspan x="1492" dy="24">held-out patients.</tspan></text>
  </g>

  <!-- Saved artifacts -->
  <path class="flow-arrow" d="M1600 675 V700"/>
  <rect x="70" y="713" width="1660" height="96" rx="16" fill="#e7f1ef" stroke="#bcd2ce" stroke-width="2"/>
  <text x="96" y="750" font-size="17" font-weight="700" letter-spacing="1" fill="#17665e">MATCHED TRAINING OUTPUTS</text>
  <text x="455" y="750" font-size="17" font-weight="700" fill="#243b3a">sepsis_gru.keras</text>
  <text x="634" y="750" font-size="17" fill="#5c6e70">+</text>
  <text x="661" y="750" font-size="17" font-weight="700" fill="#243b3a">scaler.pkl</text>
  <text x="771" y="750" font-size="17" fill="#5c6e70">+</text>
  <text x="798" y="750" font-size="17" font-weight="700" fill="#243b3a">feature_schema.json</text>
  <text x="1000" y="750" font-size="17" fill="#5c6e70">+</text>
  <text x="1027" y="750" font-size="17" font-weight="700" fill="#243b3a">metrics.json</text>
  <text x="455" y="781" font-size="15" class="muted">Keep the model, fitted preprocessing and feature ordering from the same training run together.</text>

  <!-- Application-time inference -->
  <text x="76" y="861" class="section">02 · APPLICATION-TIME PREDICTION</text>
  <path class="flow-arrow" d="M900 809 V875"/>
  <g class="flow-arrow">
    <path d="M354 1000 H405"/><path d="M698 1000 H749"/><path d="M1042 1000 H1093"/><path d="M1386 1000 H1437"/>
  </g>
  <g>
    <rect class="flow-card" x="60" y="887" width="294" height="201" rx="16"/>
    <circle cx="91" cy="923" r="19" fill="#c58a36"/><text x="91" y="930" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">A</text>
    <text class="card-title" x="119" y="930">Patient sequence</text>
    <text class="body" x="82" y="972"><tspan x="82">12 named measurements in</tspan><tspan x="82" dy="25">time order; one observation</tspan><tspan x="82" dy="25">per step. CSV batch expects</tspan><tspan x="82" dy="25">steps 1 through 12.</tspan></text>

    <rect class="flow-card" x="404" y="887" width="294" height="201" rx="16"/>
    <circle cx="435" cy="923" r="19" fill="#c58a36"/><text x="435" y="930" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">B</text>
    <text class="card-title" x="463" y="930">Validate &amp; transform</text>
    <text class="body" x="426" y="972"><tspan x="426">Check schema and ranges.</tspan><tspan x="426" dy="25">Apply the paired imputer</tspan><tspan x="426" dy="25">and scaler in the trained</tspan><tspan x="426" dy="25">feature order.</tspan></text>

    <rect class="flow-card" x="748" y="887" width="294" height="201" rx="16"/>
    <circle cx="779" cy="923" r="19" fill="#c58a36"/><text x="779" y="930" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">C</text>
    <text class="card-title" x="807" y="930">Paired GRU model</text>
    <text class="body" x="770" y="972"><tspan x="770">Process the full input</tspan><tspan x="770" dy="25">sequence and return one</tspan><tspan x="770" dy="25">sequence-level sigmoid</tspan><tspan x="770" dy="25">probability.</tspan></text>

    <rect class="flow-card" x="1092" y="887" width="294" height="201" rx="16"/>
    <circle cx="1123" cy="923" r="19" fill="#c58a36"/><text x="1123" y="930" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">D</text>
    <text class="card-title" x="1151" y="930">Risk score &amp; level</text>
    <text class="body" x="1114" y="972"><tspan x="1114">Show probability as a score.</tspan><tspan x="1114" dy="25">Apply configurable Low /</tspan><tspan x="1114" dy="25">Moderate / High research</tspan><tspan x="1114" dy="25">thresholds.</tspan></text>

    <rect class="flow-card" x="1436" y="887" width="294" height="201" rx="16"/>
    <circle cx="1467" cy="923" r="19" fill="#c58a36"/><text x="1467" y="930" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">E</text>
    <text class="card-title" x="1495" y="930">Review &amp; report</text>
    <text class="body" x="1458" y="972"><tspan x="1458">Save to patient history.</tspan><tspan x="1458" dy="25">Review measurements and</tspan><tspan x="1458" dy="25">trends; generate a dynamic</tspan><tspan x="1458" dy="25">PDF report.</tspan></text>
  </g>

  <!-- Safety / interpretation -->
  <rect x="70" y="1133" width="1660" height="86" rx="16" fill="#fff2dc" stroke="#e8ca8f" stroke-width="2"/>
  <text x="98" y="1168" font-size="17" font-weight="700" fill="#80591f">INTERPRETATION &amp; LIMITS</text>
  <text x="365" y="1168" font-size="16" fill="#604d32">The model returns one risk score for the whole sequence; it does not generate historical per-step risk scores.</text>
  <text x="98" y="1197" font-size="15" fill="#604d32">The bundled model uses synthetic training data. Outputs have no clinical meaning and are not clinically validated.</text>
</svg>
