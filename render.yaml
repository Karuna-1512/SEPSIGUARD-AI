services:
  - type: web
    name: sepsiguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sepsiguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: SepsiGuard Administrator
      - key: MODEL_PATH
        value: models/sepsis_gru.keras
      - key: SCALER_PATH
        value: models/scaler.pkl
      - key: FEATURE_SCHEMA_PATH
        value: models/feature_schema.json
      - key: METRICS_PATH
        value: models/metrics.json

databases:
  - name: sepsiguard-db
    plan: free
    databaseName: sepsiguard
    user: sepsiguard
